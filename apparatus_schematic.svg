<rect x="55" y="105" width="1010" height="214" rx="22" fill="#e2e8f0" stroke="#334155" stroke-width="4" stroke-dasharray="11 6"/>
<rect x="88" y="170" width="145" height="68" rx="12" fill="#0f766e"/><text x="160" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="white">Laser</text>
<path d="M234 204 H397" stroke="#dc2626" stroke-width="5"/>
<rect x="397" y="155" width="16" height="98" fill="#334155"/>
<rect x="397" y="188" width="16" height="5" fill="#f8fafc"/>
<rect x="397" y="213" width="16" height="5" fill="#f8fafc"/>
<text x="405" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#0f172a">Double slits</text>
